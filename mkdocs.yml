site_name: Robin LIORET
site_url: https://robinlioret.github.io/cv-en/

copyright: >
  Copyright &copy; 2024-2025 Robin LIORET – <a href="#__consent">Change cookie settings</a>

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: _assets/logo.svg
  favicon: _assets/favicon.svg

  icon:
    alternate: language

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - toc.follow
#    - toc.integrate
#    - header.autohide
    - announce.dismiss
    - content.footnote.tooltips
    - content.tooltips

extra_css:
  - _stylesheets/progress-bar-001.css
  - _stylesheets/extra.css

extra:
  generator: false

  consent: # https://squidfunk.github.io/mkdocs-material/setup/ensuring-data-privacy/#cookie-consent
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

    actions:
      - accept
      - reject

  social: # https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-footer/#social-links
    - icon: fontawesome/brands/github
      link: https://github.com/robinlioret

    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/leikt.solreihin

    - icon: fontawesome/brands/linkedin
      link: https://fr.linkedin.com/in/robin-lioret-1a278b89

#  alternate:
#    - name: English
#      link: /cv-en/
#      lang: en

#    - name: Français
#      link: /cv-fr/
#      lang: fr

plugins:
  - search

markdown_extensions:
  - attr_list
  - abbr
  - md_in_html
  - footnotes
  - def_list
  - markdown.extensions.attr_list
  - pymdownx.blocks.admonition
  - pymdownx.blocks.definition
  - pymdownx.blocks.details
  - pymdownx.betterem
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.progressbar
  - pymdownx.smartsymbols

  - toc:
      title: On this page
      permalink: true

  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.blocks.tab:
      alternate_style: true

  - pymdownx.blocks.definition

watch:
  - includes
  - overrides

nav:
  - Resume: index.md
  - Skills:
      - skills/index.md
      - Automation & Programming:
          - skills/automation/index.md
      - AWS:
          - skills/aws/index.md
      - Kubernetes & Containerization:
          - skills/containerization/index.md
      - Linux:
          - skills/linux/index.md
      - Security:
          - skills/security/index.md
      - Value streaming:
          - skills/value-streaming/index.md
  - Portfolio:
      - portfolio/index.md
      - Automation:
          - Documentation automation: portfolio/automation/documentation-automation.md
          - Datadog Monitoring with IaC: portfolio/automation/datadog-iac.md
      - Kubernetes:
          - GitOps Revamp: portfolio/kubernetes/gitops-revamp.md
          - Complex scaling: portfolio/kubernetes/complex-scaling.md

  - Gists:
      - gists/index.md
      - Kiwy: gists/kiwy.md
      - Pillars: gists/pillars.md
#      - Pillars: gists/pillars.md
#      - "Learning strategies and tactics": gists/learning.md
#      - "A word about temporary": gists/temporary.md
#      - "A word about experience": gists/experience.md
#      - "A word about diplomas": gists/diploma.md